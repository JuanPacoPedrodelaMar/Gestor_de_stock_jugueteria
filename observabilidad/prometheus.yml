# Prometheus: junta las métricas (GET /metrics) de los 5 servicios cada 15 s.
# Los nombres de host son los de la red interna de Docker Compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: auth
    static_configs: [{ targets: ["auth:8001"] }]
  - job_name: productos
    static_configs: [{ targets: ["productos:8000"] }]
  - job_name: clientes
    static_configs: [{ targets: ["clientes:8000"] }]
  - job_name: movimientos
    static_configs: [{ targets: ["movimientos:8000"] }]
  - job_name: worker-alertas
    static_configs: [{ targets: ["worker-alertas:8003"] }]
