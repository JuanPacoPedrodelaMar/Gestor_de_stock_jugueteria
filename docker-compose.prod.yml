# Producción. Se usa SOLO (sin el docker-compose.yml de desarrollo):
#
#     docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#     docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Diferencias con desarrollo:
#   - Las imágenes se descargan del registry (las publica el pipeline, ver
#     .github/workflows/ci-cd.yml); no se construyen en el servidor.
#   - Un único punto de entrada: Caddy (80/443, TLS automático) -> gateway nginx.
#     NINGÚN otro puerto se publica (ni APIs, ni Redis, ni RabbitMQ, ni /metrics).
#   - Sin usuarios de prueba ni endpoint de seed; los secretos son OBLIGATORIOS.
#   - Logs con rotación (no llenan el disco).
# Ver docs/DESPLIEGUE.md y .env.prod.example.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-comun: &comun
  restart: unless-stopped
  logging: *logging

services:
  caddy:
    <<: *comun
    image: caddy:2-alpine
    container_name: jugueteria-caddy
    environment:
      DOMINIO: ${DOMINIO:?Definí DOMINIO en .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  redis:
    <<: *comun
    image: redis:7-alpine
    container_name: jugueteria-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    <<: *comun
    image: rabbitmq:3-management-alpine
    container_name: jugueteria-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Definí RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Definí RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth:
    <<: *comun
    image: ${IMAGE_PREFIX:?Definí IMAGE_PREFIX (ej. ghcr.io/usuario/jugueteria)}-auth:${IMAGE_TAG:-latest}
    container_name: jugueteria-auth
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Definí AUTH_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/auth.db
      CORS_ORIGINS: https://${DOMINIO}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:?Definí AUTH_ADMIN_EMAIL (primer administrador)}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Definí AUTH_ADMIN_PASSWORD}
      AUTH_ADMIN_DNI: ${AUTH_ADMIN_DNI:-}
      HABILITAR_USUARIOS_PRUEBA: "false"
    volumes:
      - auth_data:/app/data
    depends_on:
      redis: { condition: service_healthy }

  productos:
    <<: *comun
    image: ${IMAGE_PREFIX}-productos:${IMAGE_TAG:-latest}
    container_name: jugueteria-productos
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/jugueteria.db
      CORS_ORIGINS: https://${DOMINIO}
      HABILITAR_SEED_ENDPOINT: "false"
      MOVIMIENTOS_SERVICE_URL: http://movimientos:8000
    volumes:
      - productos_data:/app/data
    depends_on:
      redis: { condition: service_healthy }

  clientes:
    <<: *comun
    image: ${IMAGE_PREFIX}-clientes:${IMAGE_TAG:-latest}
    container_name: jugueteria-clientes
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/clientes.db
      CORS_ORIGINS: https://${DOMINIO}
    volumes:
      - clientes_data:/app/data
    depends_on:
      redis: { condition: service_healthy }

  movimientos:
    <<: *comun
    image: ${IMAGE_PREFIX}-movimientos:${IMAGE_TAG:-latest}
    container_name: jugueteria-movimientos
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/movimientos.db
      CORS_ORIGINS: https://${DOMINIO}
      PRODUCTOS_SERVICE_URL: http://productos:8000
      CLIENTES_SERVICE_URL: http://clientes:8000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      OUTBOX_INTERVALO_SEGUNDOS: ${OUTBOX_INTERVALO_SEGUNDOS:-5}
    volumes:
      - movimientos_data:/app/data
    depends_on:
      productos: { condition: service_healthy }
      clientes: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker-alertas:
    <<: *comun
    image: ${IMAGE_PREFIX}-worker-alertas:${IMAGE_TAG:-latest}
    container_name: jugueteria-worker-alertas
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      WORKER_HEALTH_PORT: 8003
    volumes:
      - alertas_data:/app/data
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    <<: *comun
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    container_name: jugueteria-frontend
    environment:
      # "origen" = el panel llama a las APIs por el mismo dominio (gateway nginx).
      PRODUCTOS_API_URL: origen
      AUTH_API_URL: origen
      MOVIMIENTOS_API_URL: origen
      CLIENTES_API_URL: origen
      HABILITAR_USUARIOS_PRUEBA: "false"
    depends_on:
      auth: { condition: service_healthy }
      productos: { condition: service_healthy }
      clientes: { condition: service_healthy }
      movimientos: { condition: service_healthy }

  # --- Observabilidad (opcional): docker compose -f docker-compose.prod.yml --profile observabilidad up -d
  # Prometheus y Grafana NO se publican: se acceden por túnel SSH (ver docs/DESPLIEGUE.md).
  prometheus:
    <<: *comun
    image: prom/prometheus:v2.55.1
    container_name: jugueteria-prometheus
    profiles: ["observabilidad"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_data:/prometheus

  grafana:
    <<: *comun
    image: grafana/grafana:11.3.0
    container_name: jugueteria-grafana
    profiles: ["observabilidad"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Definí GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  rabbitmq_data:
  auth_data:
  productos_data:
  clientes_data:
  movimientos_data:
  alertas_data:
  prometheus_data:
  grafana_data:
