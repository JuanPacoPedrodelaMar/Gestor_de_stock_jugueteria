# Encabezados de seguridad de las respuestas ESTÁTICAS del panel (ver nginx.conf).
# Las respuestas de las APIs ya traen los suyos (los agrega cada servicio).
#
# CSP: scripts solo propios (sin inline ni eval); estilos propios + inline (el panel usa
# <style> y atributos style) + Google Fonts; conexiones a las APIs: mismo origen (producción,
# detrás del gateway) o localhost (desarrollo, cada API en su puerto).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.onrender.com http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
