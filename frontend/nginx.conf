# Frontend estático + gateway hacia las APIs.
#
# - Sirve el panel (HTML/JS) con encabezados de seguridad y CSP estricta.
# - Actúa de gateway: en producción el navegador habla con UN solo origen
#   (https://dominio) y nginx reparte según la ruta. Así no hace falta CORS, solo
#   se publica un puerto y /metrics, /docs y /api/v1/dev NO quedan expuestos.
#   En desarrollo el panel sigue llamando a cada API en su puerto (config.js).
# - Limita los intentos de login por IP.

# 10 pedidos por minuto por IP al login (más un pequeño margen, ver "burst").
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Las APIs se resuelven al momento del pedido (no al
    # arrancar nginx), así el panel arranca aunque alguna API todavía no esté.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up_auth        http://auth:8001;
    set $up_productos   http://productos:8000;
    set $up_clientes    http://clientes:8000;
    set $up_movimientos http://movimientos:8000;

    # Salud del propio contenedor de frontend (usado por el healthcheck de Docker)
    location /healthz {
        access_log off;
        include /etc/nginx/snippets/seguridad.conf;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # config.js se genera en runtime; evitar que el navegador lo cachee
    location = /config.js {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store";
    }

    # ----------------------------- Gateway -----------------------------
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $up_auth;
    }
    location /api/v1/auth/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $up_auth;
    }
    # El historial de un producto lo atiende Movimientos aunque la ruta empiece
    # con /productos. Las regex se evalúan antes que los prefijos simples.
    location ~ ^/api/v1/productos/[0-9]+/movimientos {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $up_movimientos;
    }
    location /api/v1/productos {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $up_productos;
    }
    location /api/v1/solicitudes-stock {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $up_productos;
    }
    location /api/v1/clientes {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $up_clientes;
    }
    location /api/v1/movimientos {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $up_movimientos;
    }
    # Cualquier otra ruta de API (p. ej. /api/v1/dev/seed-productos) NO se expone por el gateway.
    location /api/ {
        return 404;
    }
    # Las métricas son internas (las lee Prometheus dentro de la red de Docker).
    location = /metrics {
        return 404;
    }

    # ----------------------------- Estáticos -----------------------------
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri $uri/ /index.html;
    }

    # Compresión básica para los estáticos del panel
    gzip on;
    gzip_types text/css application/javascript application/json;
}
